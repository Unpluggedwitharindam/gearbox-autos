name: Build Android app
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm install
      - run: npm run app:test
      - run: npm run app:build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      - run: npm run app:sync
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: gearbox-autos-apk, path: android/app/build/outputs/apk/debug/*.apk }
      - name: Build signed Play Store bundle when upload key is configured
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEY_BASE64" ]; then
            echo "Signed release skipped: configure upload-key secrets first."
            exit 0
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/gearbox-upload.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$UPLOAD_KEY_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          cd android
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: gearbox-autos-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
